repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # 2 MB: permite los datos de muestra sintéticos (sample_station_status.csv
        # ~1.6 MB) que se versionan a propósito; bloquea datos crudos pesados.
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
