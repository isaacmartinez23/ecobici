name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias base + dev
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
          # LightGBM opcional: si instala, se prueba; si no, el pipeline usa sklearn.
          pip install lightgbm || echo "LightGBM no disponible; se usará el respaldo sklearn."

      - name: Lint (ruff)
        run: ruff check .

      - name: Pruebas (pytest)
        run: python -m pytest -q

      - name: Pipeline con datos de muestra (humo)
        run: |
          python data/sample/generate_sample.py
          python run_pipeline.py

      - name: Verificar arranque de Streamlit
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app/app.py", default_timeout=90).run()
          assert not at.exception, at.exception
          print("Streamlit arranca sin excepciones.")
          PY
