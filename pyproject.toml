[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecobici-demanda"
version = "0.1.0"
description = "ECOBICI: dónde faltan bicicletas y a qué hora. Pipeline reproducible de demanda, disponibilidad y rebalanceo."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]
keywords = ["ecobici", "gbfs", "duckdb", "streamlit", "series-temporales", "rebalanceo"]

dependencies = [
    "duckdb>=1.5",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pydeck>=0.8",
    "matplotlib>=3.7",
    "joblib>=1.3",
]

[project.optional-dependencies]
# Extras que pueden no instalarse en todos los entornos.
model = ["lightgbm>=4.0"]
geo = ["geopandas>=0.14"]
dev = ["pytest>=7.4", "ruff>=0.4", "pre-commit>=3.5"]

[tool.setuptools]
packages = ["common", "ingest", "transform", "models"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", ".venv", "reports/figures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = [
    "E501",  # el largo de línea lo maneja el formateo, no fallamos por él
    "B008",  # llamadas en argumentos por defecto (usado en typer-like CLIs)
]

[tool.ruff.lint.isort]
known-first-party = ["common", "ingest", "transform", "models", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
